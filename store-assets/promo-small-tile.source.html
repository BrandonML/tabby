<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Fraunces";
    src: url("http://localhost:4173/extension/fonts/fraunces.woff2") format("woff2");
    font-weight: 400 700;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-width: 600px; min-height: 400px; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    background: #e4e1d3;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #tile {
    position: relative;
    width: 440px;
    height: 280px;
    overflow: hidden;
    background: #3f5d42;
  }
  .photo-side {
    position: absolute;
    top: 0; right: 0;
    width: 190px;
    height: 280px;
    overflow: hidden;
  }
  .photo-side img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 30%;
    display: block;
  }
  .photo-side::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 14px 0 24px -14px rgba(20, 30, 20, 0.55);
  }
  .text-side {
    position: absolute;
    top: 0; left: 0;
    width: 250px;
    height: 280px;
    padding: 30px 26px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .word {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 52px;
    line-height: 1;
    color: #f6efdd;
    margin-bottom: 14px;
  }
  .tag {
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 19px;
    color: #f6efdd;
    line-height: 1.35;
    opacity: 0.92;
  }
  .stamp {
    margin-top: 16px;
    display: inline-block;
    align-self: flex-start;
    font-family: ui-monospace, "IBM Plex Mono", "SF Mono", Consolas, monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #2c4230;
    background: #f6efdd;
    padding: 5px 10px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div id="tile">
    <div class="text-side">
      <div class="word">Tabby</div>
      <div class="tag">Real adoptable cats.<br>One new tab at a time.</div>
      <div class="stamp">New Tab Extension</div>
    </div>
    <div class="photo-side">
      <img src="https://cataas.com/cat/0BTTVEVWXNyOgXYd" alt="">
    </div>
  </div>
</body>
</html>
