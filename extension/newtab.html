<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabby</title><link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png"><link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png"><link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="newtab.css"></head>
  <body>
    <main class="shell">
      <header>
        <div class="brand">
          <p class="wordmark">Tabby</p>
          <span class="brand-rule" aria-hidden="true"></span>
          <p class="tagline">One cat at a time.</p>
        </div>
        <div class="header-actions">
          <button id="explore" class="icon-btn" type="button" aria-label="Explore another area" title="Explore another area"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/></svg></button>
          <button id="faq" class="icon-btn" type="button" aria-label="Frequently asked questions" title="Frequently asked questions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
          <button id="settings" class="icon-btn" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </header>
      <section id="card" class="card loading" aria-live="polite" hidden><p>Finding an adoptable cat near you…</p></section>
      <section id="location-panel" class="location-panel" hidden>
        <h1>Find cats near you</h1>
        <p>Use your location for the closest available cats.</p>
        <div class="location-actions">
          <button id="use-location" class="primary" type="button">Use my location</button>
          <button id="open-settings" class="secondary" type="button">or enter your zip code</button>
        </div>
      </section>
      <p id="explore-banner" class="notice" role="status" hidden><span class="explore-text">Exploring near <span id="explore-label"></span>.</span><span class="explore-links"><button id="show-another-explore-cat" class="notice-link" type="button">Show another cat</button> · <button id="back-to-my-area" class="notice-link" type="button">Back to my area</button></span></p>
      <p id="notice" class="notice" role="status" hidden></p>
      <footer class="footer">
        <p class="credit">Built by <a href="https://linke.ro/brandon" target="_blank" rel="noopener noreferrer">Brandon</a></p>
        <p class="links">
          <a href="https://github.com/BrandonML/tabby" target="_blank" rel="noopener noreferrer">GitHub</a>
          <span class="sep">·</span>
          <a href="https://www.facebook.com/scivolette" target="_blank" rel="noopener noreferrer">Facebook</a>
          <span class="sep">·</span>
          <a href="https://www.linkedin.com/in/scivolette/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <span class="sep">·</span>
          <a href="https://buymeacoffee.com/scivolette" target="_blank" rel="noopener noreferrer">Buy me a coffee</a>
          <span class="sep">·</span>
          <a href="https://github.com/BrandonML/tabby/issues" target="_blank" rel="noopener noreferrer">Report an issue</a>
        </p>
      </footer>
    </main>
    <script type="module" src="newtab.js"></script>
  </body>
</html>
