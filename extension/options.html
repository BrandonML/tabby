<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Tabby settings</title><link rel="stylesheet" href="newtab.css"></head><body><main class="shell"><header><p class="eyebrow">TABBY SETTINGS</p><button id="close-settings" class="quiet" type="button" aria-label="Close settings">Close</button></header><section class="location-panel"><h1>Your Location</h1><form id="settings-form"><div class="location-actions"><button id="use-location" class="primary" type="button">Use my location</button></div><div><label for="zip">Zip Code</label><input id="zip" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" placeholder="Optional"></div><button type="submit">Save</button></form><p id="saved" class="notice"></p></section></main><script type="module" src="options.js"></script></body></html>
