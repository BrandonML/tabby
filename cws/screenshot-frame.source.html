<!doctype html>
<!--
  Screenshot capture harness for GitHub issue #28: CWS/EWS screenshots taken
  directly from newtab.html (see the git history on the 5 shipped
  screenshots) show the real 620px-wide card centered on a 1280x800 canvas
  with huge empty margins on either side, since .shell's max-width is fixed
  regardless of viewport. This harness does NOT touch that real responsive
  layout (extension/newtab.css / newtab.html are unmodified) -- it loads the
  real stylesheet and the real newtab.js unmodified, seeds
  chrome.storage.local with canned sample data instead of a live API call
  (an automated capture can't depend on a real location or the live API's
  current inventory -- same reasoning as the original 5 screenshots), and
  scales the whole rendered card up via CSS transform so it fills 80%+ of
  the canvas width instead of a fixed 620px.

  The <main class="shell">...</main> markup below is hand-copied from
  extension/newtab.html, since the real newtab.js's top-level functions
  are private to its module scope (unlike the test suite's classic-script
  inlining) and there's no clean way to fetch+inject the real HTML's body
  without base-URL complications. If newtab.html's structure changes,
  this copy needs to be updated to match -- same maintenance model as
  promo-marquee.source.html / promo-small-tile.source.html already use for
  their own hand-built markup.

  Capture instructions:
  1. Serve the repo root at http://localhost:4173 (same convention as the
     other cws/*.source.html files) -- e.g. `npx serve -l 4173 .` from the
     repo root.
  2. Open one of the exact URLs below at a 1280x800 viewport and screenshot
     the full viewport. ?scale= and ?shiftY= override the default 1.55x/
     top-aligned crop per scene, since where the relevant content sits on
     the card differs enough between scenes that one crop can't serve all
     of them -- see the .stage rule below for how each interacts with the
     card's own (close to square) aspect ratio.

     screenshot-1-main-card.png:
       ?scene=main
       (default 1.55x, top-aligned -- photo + name in frame)
     screenshot-2-explore.png:
       ?scene=explore&shiftY=-390
       (shifted up so the card's tail + the explore banner are in frame,
       trading away the top of the photo and the header)
     screenshot-3-first-run.png:
       ?scene=first-run&scale=1.85
       (the location-panel is short enough that the full header+panel+
       footer fits even at a much higher scale -- ~90% width, uncropped)
     screenshot-5-fee-tags.png:
       ?scene=fee-tags&scale=1.3
       (lower scale so the status chips + fee, which sit below the name/
       meta this scene doesn't otherwise need, are in frame)

     screenshot-4-settings.png comes from the companion
     screenshot-frame-options.source.html (no query params needed -- the
     settings panel is short enough to fit fully at that file's default
     scale too).
-->
<html>
<head>
<meta charset="utf-8">
<title>Tabby screenshot frame</title>
<link rel="preload" href="http://localhost:4173/extension/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="http://localhost:4173/extension/newtab.css">
<style>
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body { display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; }
  .stage {
    /* .shell caps at 620px regardless of viewport width -- scaling the
       whole rendered card up (instead of touching .shell's own max-width)
       keeps this harness's changes entirely outside the real CSS. The
       shell's own aspect ratio is close to square, so it can't be scaled
       to fill 80%+ of a 1280x800 canvas' WIDTH while every line of text
       still fits inside its HEIGHT too -- those two goals are in tension
       on a card this shape. 1.55x (the default, overridable per-scene via
       ?scale=) lands at ~75% width (620px -> 961px) while keeping the
       full photo and the cat's name in frame, cropping off the least
       essential tail below it (meta line, fee, distance, rescue link,
       profile button, footer) -- a large, clean improvement over the
       original ~48%, short of the letter of "80%" but not at the cost of
       a screenshot with visibly truncated text. Scenes needing content
       further down the card (fee-tags) pass a lower ?scale= instead, to
       keep that specific content in frame. */
    transform: scale(var(--scale, 1.55));
    transform-origin: top center;
    /* margin-top shifts the box in the flex layout *before* the transform
       scales it around its (now-shifted) top edge, so this is a 1:1 pixel
       shift on the final canvas regardless of --scale -- used by scenes
       whose relevant content (e.g. the explore banner) sits further down
       the card than a top-aligned crop would ever reach. */
    margin-top: var(--shift-y, 0px);
  }
</style>
</head>
<body>
  <div class="stage">
    <main class="shell">
      <header>
        <p class="wordmark">Tabby</p>
        <div class="header-actions">
          <button id="explore" class="quiet" type="button">Explore another area</button>
          <button id="settings" class="quiet">Settings</button>
        </div>
      </header>
      <section id="card" class="card loading" aria-live="polite" hidden><p>Finding an adoptable cat near you…</p></section>
      <section id="location-panel" class="location-panel" hidden>
        <h1>Find cats near you</h1>
        <p>Use your location for the closest available cats.</p>
        <div class="location-actions">
          <button id="use-location" class="primary" type="button">Use my location</button>
          <button id="open-settings" class="secondary" type="button">or enter your zip code</button>
        </div>
      </section>
      <p id="explore-banner" class="notice" role="status" hidden><span class="explore-text">Exploring near <span id="explore-label"></span>.</span><span class="explore-links"><button id="show-another-explore-cat" class="notice-link" type="button">Show another cat</button> · <button id="back-to-my-area" class="notice-link" type="button">Back to my area</button></span></p>
      <p id="notice" class="notice" role="status" hidden></p>
      <footer class="footer">
        <p class="tagline">One cat at a time.</p>
        <p class="credit">Built by <a href="https://linke.ro/brandon" target="_blank" rel="noopener noreferrer">Brandon</a></p>
        <p class="links">
          <a href="https://github.com/BrandonML/tabby" target="_blank" rel="noopener noreferrer">GitHub</a>
          <span class="sep">·</span>
          <a href="https://www.facebook.com/scivolette" target="_blank" rel="noopener noreferrer">Facebook</a>
          <span class="sep">·</span>
          <a href="https://www.linkedin.com/in/scivolette/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <span class="sep">·</span>
          <a href="https://buymeacoffee.com/scivolette" target="_blank" rel="noopener noreferrer">Buy me a coffee</a>
          <span class="sep">·</span>
          <a href="https://github.com/BrandonML/tabby/issues" target="_blank" rel="noopener noreferrer">Report an issue</a>
        </p>
      </footer>
    </main>
  </div>
<script>
  // Stubs chrome.* and fetch with canned data instead of a live API call --
  // this classic script runs before the deferred module script below, so
  // the real newtab.js sees these in place from its very first line.
  const scene = new URLSearchParams(location.search).get('scene') || 'main';

  const SAMPLE_CARD = {
    id: 'sample-1',
    name: 'Clementine',
    breed: 'Domestic Shorthair',
    age: 'Young',
    sex: 'Female',
    distanceMiles: 3.2,
    imageUrl: 'https://cdn.rescuegroups.org/11705/pictures/animals/22325/22325206/102816081.jpg?width=800',
    rescueName: 'Second Chance Animal Rescue',
    rescueUrl: 'https://example.org/rescue',
    profileUrl: 'https://example.org/rescue/clementine',
    isAdoptionPending: scene === 'fee-tags',
    isSpecialNeeds: scene === 'fee-tags',
    adoptionFee: '$75',
    updatedAt: new Date(Date.now() - 2 * 24 * 60 * 60 * 1000).toISOString()
  };

  const EXPLORE_CARD = { ...SAMPLE_CARD, id: 'sample-explore-1', name: 'Whiskers', distanceMiles: 5.5 };

  const seededSettings = scene === 'first-run' ? { postalcode: '', location: null } : { postalcode: '90210', location: null };
  const seededFeedCache = scene === 'first-run' ? null : {
    cards: [SAMPLE_CARD],
    fetchedAt: Date.now(),
    radiusMiles: 25,
    location: { postalcode: '90210' },
    page: 1,
    seenIds: []
  };

  window.chrome = {
    storage: {
      local: {
        get: async () => ({ settings: seededSettings, feedCache: seededFeedCache }),
        set: async () => {}
      }
    },
    runtime: { openOptionsPage: () => {}, getURL: (path) => path },
    tabs: { query: (_q, cb) => cb([{ id: 1 }]), update: () => {} }
  };

  window.fetch = async (url, opts) => {
    if (scene === 'explore' && String(url).includes('/api/nearby-cats')) {
      return { ok: true, json: async () => ({ cards: [EXPLORE_CARD], radiusMiles: 25 }) };
    }
    // Any other call (a background refresh, etc.) is a no-op that never
    // resolves -- the initial render already came from the seeded cache
    // above, so nothing should visibly change if this fires.
    return new Promise(() => {});
  };

  if (scene === 'explore') {
    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('explore').click(), 200);
    });
  }

  const scaleOverride = new URLSearchParams(location.search).get('scale');
  if (scaleOverride) document.documentElement.style.setProperty('--scale', scaleOverride);
  const shiftYOverride = new URLSearchParams(location.search).get('shiftY');
  if (shiftYOverride) document.documentElement.style.setProperty('--shift-y', `${shiftYOverride}px`);
</script>
<script type="module" src="http://localhost:4173/extension/newtab.js"></script>
</body>
</html>
