<!doctype html>
<!--
  Companion to screenshot-frame.source.html for the Settings screenshot --
  see that file's header comment for the full rationale, including why (per
  issue #66) the <main class="shell">...</main> markup is fetched from the
  real extension/options.html at load time and injected into .stage, rather
  than hand-copied into this file.

  Capture instructions: same as screenshot-frame.source.html -- serve the
  repo root at http://localhost:4173, then open
  http://localhost:4173/webstore/screenshot-frame-options.source.html
-->
<html>
<head>
<meta charset="utf-8">
<title>Tabby screenshot frame (settings)</title>
<link rel="stylesheet" href="http://localhost:4173/extension/newtab.css">
<style>
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  .stage { transform: scale(1.85); }
</style>
</head>
<body>
  <div class="stage"></div>
<script>
  window.chrome = {
    storage: { local: { get: async () => ({ settings: { postalcode: '90210' } }), set: async () => {} } },
    runtime: { getURL: (path) => path },
    tabs: { query: (_q, cb) => cb([{ id: 1 }]) }
  };

  async function boot() {
    const response = await fetch('http://localhost:4173/extension/options.html');
    const html = await response.text();
    const shell = new DOMParser().parseFromString(html, 'text/html').querySelector('main.shell');
    document.querySelector('.stage').appendChild(document.importNode(shell, true));

    const script = document.createElement('script');
    script.type = 'module';
    script.src = 'http://localhost:4173/extension/options.js';
    document.body.appendChild(script);
  }
  boot();
</script>
</body>
</html>
